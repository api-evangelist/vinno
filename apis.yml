name: VINNO
description: 'VINNO Corporation (飞依诺科技股份有限公司) is a Chinese medical device manufacturer,
  headquartered in Suzhou, that develops and produces digital color ultrasound (Doppler)
  imaging systems — cart-based, portable, and handheld/pocket devices — for clinical
  diagnostics and research. Product lines include the ULTIMUS and VINNO R-series ultrasound
  platforms plus Stream-series CPAP respiratory devices, built on proprietary soft
  beamforming and ultra-high-resolution micro-vascular imaging technology, with remote-diagnostic
  center and support services across 50+ countries. Surfaced as a portfolio company
  of Qiming Venture Partners. As of enrichment the company publishes no public API,
  SDK, or developer surface (medical-device hardware manufacturer).'
